name: Build Runner Image

# Builds the image the ARC runner pools run on (infra/runner-image/). Stays on
# a GitHub-hosted runner on purpose, the only GradPace job that does: the
# cluster's runners run *on* this image, so if a bad image ever broke the
# pools, this is how the fix ships.
on:
  push:
    branches:
      - main
      - arc-ci-runners
    paths:
      - 'infra/runner-image/**'
      - '.github/workflows/runner-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gradpace/actions-runner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Runner pools pin the sha- tag, so a rebuild never changes what an
          # already-deployed pool runs until its manifest is updated.
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./infra/runner-image
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
