name: Build and Push Frontend to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase: GHCR repo refs must be all-lowercase, but this repo's
  # actual name (github.repository) is mixed-case, and must match what
  # docker-compose.prod.yml pulls (ghcr.io/gradpace/gradpace-prototype/frontend).
  IMAGE_NAME: gradpace/gradpace-prototype/frontend

jobs:
  test:
    # Self-hosted: keeps growing test-suite minutes off the GH Actions quota.
    # Only triggers on push to main right now (see `on:` above), not on PRs -
    # if a pull_request trigger is ever added, self-hosted runners execute
    # whatever the PR's workflow contains, so gate it to trusted authors.
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '26'

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: make test-frontend

      - name: Prune pnpm store
        # Runs even if lint/build fails. This is a persistent self-hosted
        # box, so pnpm's store accumulates on disk across every run instead
        # of getting thrown away like an ephemeral GH-hosted runner's would.
        if: always()
        run: pnpm store prune

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value={{date 'YYYY-MM-DD-HHmmss' tz='America/New_York'}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
