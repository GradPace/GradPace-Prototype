# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv" # See documentation for possible values
    directory: "backend/" # Location of package manifests
    versioning-strategy: increase-if-necessary # bump pyproject.toml's floor when a release would fall outside the existing >= constraint
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 20
  
  - package-ecosystem: "docker" # See documentation for possible values
    directory: "backend/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 20

  - package-ecosystem: "npm" # Covers pnpm too - detected via pnpm-lock.yaml
    directory: "frontend/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 20

  - package-ecosystem: "docker" # See documentation for possible values
    directory: "frontend/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 20