name: Deploy to Production - Backend

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Push Backend to GHCR"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read

    steps:
      # gradpace-prototype/backend is a private GHCR package - `docker compose
      # pull` needs to be authenticated first. Uses this run's own token
      # (packages: read above), not a long-lived credential on the host.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to production
        run: |
          cd /srv/prototype
          make deploy-backend
