name: gradpace-dev

services:
  # Backend - Django dev server with live reload.
  # Runs the plain uv image (not backend/Dockerfile, which is the lean prod
  # build with only the `prod` dependency group); dependencies install at
  # container start since ./backend is bind-mounted. PIPELINE is unset, so
  # config/settings/__init__.py loads dev.py: sqlite, DEBUG=True, console email.
  backend:
    image: ghcr.io/astral-sh/uv:python3.14-alpine
    working_dir: /app
    command: >
      sh -c "uv sync &&
             uv run manage.py migrate &&
             uv run manage.py runserver 0.0.0.0:8000"
    environment:
      - UV_PROJECT_ENVIRONMENT=/app/.venv
      # Keeps .pyc files off the host bind mount - otherwise they're written
      # back into ./backend and can go stale relative to edited source (seen
      # as phantom ModuleNotFoundErrors for packages already removed from
      # pyproject.toml).
      - PYTHONPYCACHEPREFIX=/pycache
    volumes:
      - ./backend:/app            # live code - runserver reloads on save
      - backend_venv:/app/.venv   # container's Linux venv, kept off the host
      - backend_pycache:/pycache  # compiled bytecode, kept off the host
    ports:
      - "8000:8000"
    tty: true

  # Frontend - Vite dev server with HMR.
  # Runs straight from a node image (not frontend/Dockerfile, which is the
  # lean prod build serving a static bundle via nginx). The apk packages in
  # `command` are canvas's (added for jsdom's toDataURL in Hero.test.tsx)
  # own documented Alpine build deps - it has no prebuilt musl binary, so
  # pnpm install falls back to node-gyp rebuild without them. Keep each
  # command on one line: `>` keeps the line breaks in these more-indented
  # lines, so a break mid-command runs the rest as a separate command.
  frontend:
    image: node:26-alpine
    working_dir: /app
    environment:
      # Without this, corepack's first-run download prompt waits on stdin,
      # which `docker compose up -d` never attaches - it just hangs forever.
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    command: >
      sh -c "apk add --no-cache python3 make g++ pkgconfig cairo-dev pango-dev jpeg-dev giflib-dev librsvg-dev &&
             npm install -g corepack &&
             corepack enable &&
             pnpm install &&
             pnpm dev --host"
    volumes:
      - ./frontend:/app                           # live code - Vite HMR reloads on save
      - frontend_node_modules:/app/node_modules   # container's Linux modules, kept off the host
    ports:
      - "5173:5173"
    tty: true
    depends_on:
      - backend

volumes:
  backend_venv:
  backend_pycache:
  frontend_node_modules:

# No db / mail services: dev.py uses sqlite and the console email backend.
# To develop against Postgres instead, point dev.py's DATABASES at a `db`
# service here and add one (see k8s/db-statefulset.yaml for the shape).
