[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "english-words>=2.0.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.7",
]
docs = [
    "furo>=2025.12.19",
    "sphinx>=9.1.0",
]
prod = [
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.5",
    "whitenoise>=6.12.0",
]

[tool.ruff]
line-length = 100
# Generated, not hand-maintained - not worth linting/reformatting.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.lint.per-file-ignores]
# config/settings/{dev,prod,test}.py each do `from .base import *` on
# purpose (see config/settings/__init__.py) - star-import warnings here are
# expected, not bugs.
"config/settings/*.py" = ["F401", "F403", "F405"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

