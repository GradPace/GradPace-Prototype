name: Deploy to Production - Backend

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Push Backend to GHCR"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # Creates a GitHub Deployment for this run - the "GitHub for Jira" app
    # picks these up automatically and shows them on linked issues (e.g.
    # GP-25) under Deployments, so long as the commit/branch/PR references
    # the issue key.
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      # gradpace-prototype/backend is a private GHCR package - `docker compose
      # pull` needs to be authenticated first. Uses this run's own token
      # (packages: read above), not a long-lived credential on the host.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync deploy scripts with main
        # /srv/prototype is a persistent checkout on this host, not something
        # actions/checkout populates - without this, Makefile/compose changes
        # merged to main never actually reach the host that runs them.
        # Fetches over HTTPS with this run's own short-lived token instead of
        # the origin remote's SSH config, which has no key set up on the host.
        run: |
          cd /srv/prototype
          git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
          git reset --hard FETCH_HEAD

      - name: Deploy to production
        # Pin to this commit's own image instead of :latest - a service
        # update can no-op if Swarm doesn't see the tag string change, even
        # though the digest behind :latest moved (see Makefile).
        run: |
          cd /srv/prototype
          make deploy-backend TAG=sha-$(echo "${{ github.event.workflow_run.head_sha || github.sha }}" | cut -c1-7)

      - name: Verify the deployed backend is healthy and serving the new image
        run: |
          sleep 5
          curl -sf -o /dev/null https://gradpace-api.steyaert.xyz/core/healthcheck/ || \
            (echo "::error::https://gradpace-api.steyaert.xyz/core/healthcheck/ did not return 200 after deploy" && exit 1)
