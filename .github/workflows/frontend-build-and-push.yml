name: Build and Push Frontend to GHCR

on:
  workflow_run:
    workflows: ["Test and e2e"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase: GHCR repo refs must be all-lowercase, but this repo's
  # actual name (github.repository) is mixed-case, and must match the image
  # k8s/frontend-deployment.yaml pulls (ghcr.io/gradpace/gradpace-prototype/frontend).
  IMAGE_NAME: gradpace/gradpace-prototype/frontend

jobs:
  changes:
    # Test and e2e runs once for a push touching backend/ and/or frontend/,
    # and its completion triggers this workflow AND
    # backend-build-and-push.yml both - without this check, a backend-only
    # change would also rebuild/push/redeploy the frontend image for
    # nothing.
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
    steps:
      - name: Detect whether frontend/ actually changed
        id: filter
        if: github.event_name == 'workflow_run'
        uses: dorny/paths-filter@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          base: ${{ github.event.workflow_run.head_sha }}^
          filters: |
            frontend:
              - 'frontend/**'

  build-and-push:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the exact commit SHA that triggered this build
        # See backend-build-and-push.yml's identical step for why this
        # isn't just `github.sha`.
        id: sha
        run: |
          echo "short=$(echo '${{ github.event.workflow_run.head_sha || github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=raw,value={{date 'YYYY-MM-DD-HHmmss' tz='America/New_York'}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=https://gradpace-api.steyaert.xyz
