server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text files before sending them, so pages load faster.
    # The Vite build gzips the built files ahead of time, so nginx sends
    # those .gz copies as-is (gzip_static); anything without one is
    # compressed on the fly. Photos and woff/woff2 fonts are already
    # compressed, so they're left out.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon;

    # Files in /assets/ get a new name whenever they change,
    # so browsers can safely keep them for a year.
    # If a file is missing, show "not found" instead of the home page.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never keep index.html for long, so users always get the newest version of the site.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Send any other page (like /profile) to index.html so the app can show it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
