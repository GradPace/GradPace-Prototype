server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA - any unmatched path falls back to index.html so client-side
    # routing (once added) survives a hard refresh/direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
