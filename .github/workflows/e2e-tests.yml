name: E2E Tests

# Invoked as a job from test-and-e2e.yml (`uses:
# ./.github/workflows/e2e-tests.yml`) so it runs exactly once per push,
# even when a commit touches both backend/ and frontend/ - backend-build-
# and-push.yml and frontend-build-and-push.yml each used to call this
# directly, running it twice for such a commit, before test-and-e2e.yml
# became the single shared gate both of those wait on via workflow_run
# instead. workflow_dispatch is there too so it can also be run directly
# from the Actions tab, e.g. to check the e2e suite without waiting for a
# qualifying push.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # Only one self-hosted runner exists, so these already serialize in
  # practice - this just makes that explicit and keeps a second e2e run
  # from fighting the first over the gradpace-e2e namespace/hostNetwork
  # ports if that ever changes.
  group: e2e-tests
  cancel-in-progress: false

jobs:
  e2e:
    # Same self-hosted/push-to-main-only reasoning as the `test` jobs in the
    # parent workflows: self-hosted keeps growing test-suite minutes off the
    # GH Actions quota, and this only ever runs from a push-to-main trigger,
    # never a PR, so there's no untrusted-workflow-content risk.
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Enable pnpm via corepack
        # Node 26 no longer bundles Corepack, so it must be installed before it can be enabled.
        run: |
          npm install -g corepack
          corepack enable

      - name: Install e2e dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium build
        # No --with-deps here - that apt-get installs Chromium's OS-level
        # libraries, which needs root the `deploy` CI user doesn't have.
        # Those libs are installed once, out-of-band, directly on the host
        # (see the runbook note in k8s/e2e/README.md) - this step only
        # downloads the browser binary itself into ~/.cache/ms-playwright,
        # which needs no elevated privileges.
        working-directory: e2e
        run: pnpm exec playwright install chromium

      - name: Run e2e suite against the dev stack
        # k8s/e2e/ builds/runs both apps fresh from this checkout as
        # throwaway pods in the k3s cluster (see Makefile's test-e2e target)
        # - the runner itself only needs kubectl (already present, it's the
        # same host as the k3s control plane) and pnpm/Playwright for the
        # test runner itself.
        run: make test-e2e

      - name: Sweep stale Playwright browser builds
        # Runs even if the suite fails. Single self-hosted host (no shared
        # cache across runner replicas), so this just keeps the newest build
        # of each browser family `playwright install` above would reuse and
        # drops the rest - no need for the mtime-based "untouched N hours"
        # safety margin a multi-replica setup sharing the cache would need.
        if: always()
        run: |
          PW="$HOME/.cache/ms-playwright"
          if [ -d "$PW" ]; then
            for prefix in chromium chromium_headless_shell firefox webkit ffmpeg; do
              ls -1dt "$PW/$prefix-"* 2>/dev/null | tail -n +2 | xargs -r rm -rf
            done
          else
            echo "cache-sweep: $PW not found, skipping Playwright sweep"
          fi
