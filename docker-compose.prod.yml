name: GradPace

services:
  # Backend
  backend:
    image: ghcr.io/gradpace/gradpace-prototype/backend:latest
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      - VIRTUAL_HOST=gradpace-api.steyaert.xyz
      - VIRTUAL_PORT=8000
    restart: always
    init: true
    healthcheck:
      # No curl/wget in this Alpine image - use the venv's own python instead.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/core/healthcheck/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nginx-proxy
      - gradpace_net

  mail:
    image: boky/postfix
    restart: always
    environment:
      - ALLOWED_SENDER_DOMAINS=gradpace.steyaert.xyz
      - DKIM_AUTOGENERATE=true
      # Mailu (mail.steyaert.xyz, same box) also hosts gradpace.steyaert.xyz
      # for team mailboxes and defaults to the "mail" selector - a different
      # selector here keeps this relay's DKIM key from colliding with it.
      - DKIM_SELECTOR=relay
      - MYNETWORKS=172.55.2.0/24 127.0.0.0/8
    volumes:
      - /srv/prototype/mail_dkim:/etc/opendkim/keys
    networks:
      - gradpace_net

  db:
    image: postgres:17
    container_name: gradpace_db
    # No expose/ports: api reaches db:5432 over gradpace_net. Nothing on the host.
    # .env.prod must define POSTGRES_USER / POSTGRES_DB / POSTGRES_PASSWORD to
    # match api's DATABASE_USERNAME / DATABASE_NAME / DATABASE_PASSWORD.
    env_file:
      - .env.prod
    volumes:
      - /srv/prototype/postgres_data:/var/lib/postgresql/data
    restart: always
    init: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gradpace_net

  # Frontend
  frontend:
    image: ghcr.io/gradpace/gradpace-prototype/frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gradpace_net
  

networks:
  # 172.55.1.0/24 collides with steyaertsite_steyaertsite_net on this host -
  # check `docker network inspect $(docker network ls -q) --format '{{.Name}}: {{range .IPAM.Config}}{{.Subnet}}{{end}}'`
  # before reusing/bumping this if it ever needs to change again.
  gradpace_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.55.2.0/24
          gateway: 172.55.2.1
  nginx-proxy:
    external: true