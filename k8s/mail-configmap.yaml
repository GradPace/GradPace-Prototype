# MYNETWORKS covers the k3s pod CIDR (10.42.0.0/16) and service CIDR
# (10.43.0.0/16) instead of the old Swarm overlay subnet (172.55.2.0/24) -
# these are the defaults k3s sets up uncustomized on this cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mail-config
  namespace: gradpace
data:
  ALLOWED_SENDER_DOMAINS: "gradpace.steyaert.xyz"
  DKIM_AUTOGENERATE: "true"
  DKIM_SELECTOR: "relay"
  MYNETWORKS: "10.42.0.0/16 10.43.0.0/16 127.0.0.0/8"
