# Only backend pods may reach llama-server - it has no auth of its own.
# Egress stays open so the pod can download the model from Hugging Face.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llama
  namespace: gradpace
spec:
  podSelector:
    matchLabels:
      app: llama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 8080
