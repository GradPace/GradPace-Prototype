# Every CI pod (runner pods, BuildKit) runs at this priority. Negative, so
# anything else on the cluster - production, the LLM - can evict CI when a
# node is short on room. preemptionPolicy Never means CI itself never
# evicts anything to make room for a job; it waits instead.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-low
value: -10
preemptionPolicy: Never
globalDefault: false
description: "CI runners and builders - first to be evicted, never preempt others."
