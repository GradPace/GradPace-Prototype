name: Build and Push Frontend to GHCR

on:
  workflow_run:
    workflows: ["Test and e2e"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase: GHCR repo refs must be all-lowercase, but this repo's
  # actual name (github.repository) is mixed-case, and must match the image
  # k8s/frontend-deployment.yaml pulls (ghcr.io/gradpace/gradpace-prototype/frontend).
  IMAGE_NAME: gradpace/gradpace-prototype/frontend

jobs:
  changes:
    # Test and e2e runs once for a push touching backend/ and/or frontend/,
    # and its completion triggers this workflow AND
    # backend-build-and-push.yml both - without this check, a backend-only
    # change would also rebuild/push/redeploy the frontend image for
    # nothing.
    runs-on: gradpace-light
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
    steps:
      - name: Check whether Test and e2e actually tested frontend/
        # See backend-build-and-push.yml's identical step.
        id: filter
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
            --jq '.jobs[] | select(.name == "test-frontend") | .conclusion')
          echo "test-frontend conclusion: ${conclusion:-<none>}"
          if [ "$conclusion" = "success" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    # See backend-build-and-push.yml - builds go to the shared builder.
    runs-on: gradpace-build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the exact commit SHA that triggered this build
        # See backend-build-and-push.yml's identical step for why this
        # isn't just `github.sha`.
        id: sha
        run: |
          echo "short=$(echo '${{ github.event.workflow_run.head_sha || github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Use the shared builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.arc-runners:1234

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=raw,value={{date 'YYYY-MM-DD-HHmmss' tz='America/New_York'}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # TURNSTILE_SITE_KEY is a repo variable (Settings -> Secrets and
          # variables -> Actions -> Variables), not a secret - site keys are
          # public, they end up in the bundle anyway.
          build-args: |
            VITE_API_URL=https://gradpace-api.steyaert.xyz
            VITE_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
