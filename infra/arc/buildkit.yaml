# Shared image builder for the ARC runner pools. Runner pods stay tiny and
# hand builds here with `docker buildx` (driver: remote), so one daemon on
# the worker does the CPU-heavy work and keeps one layer cache for every
# repo.
#
# Rootless: builds run as an unprivileged user (uid 1000) mapped through a
# user namespace, so no pod gets root on the node. Tested on the worker's
# Ubuntu 26.04 despite kernel.apparmor_restrict_unprivileged_userns=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: arc-runners
data:
  buildkitd.toml: |
    [worker.oci]
      gc = true
      # Policies run in order: first drop anything unused for 7 days, then
      # trim to 15 GB total if it's still over.
      [[worker.oci.gcpolicy]]
        keepDuration = "168h"
      [[worker.oci.gcpolicy]]
        maxUsedSpace = "15GB"
---
# local-path (k3s's default storage) creates the directory on the worker
# with permissions the unprivileged builder can write to - a hostPath
# would be root-owned. The 20Gi isn't enforced by local-path; the GC
# policy above is what actually caps it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkitd-cache
  namespace: arc-runners
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: arc-runners
  labels:
    app: buildkitd
spec:
  replicas: 1
  # One pod owns the ReadWriteOnce cache volume - stop the old one before
  # starting a new one on updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
    spec:
      nodeSelector:
        kubernetes.io/hostname: steyaert-worker
      priorityClassName: ci-low
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.33.1-rootless
          args:
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --addr
            - tcp://0.0.0.0:1234
            - --config
            - /etc/buildkit/buildkitd.toml
            # Safe only because the daemon runs unprivileged inside its own
            # container - lets it run without extra kernel privileges.
            - --oci-worker-no-process-sandbox
          ports:
            - containerPort: 1234
          readinessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "3"
              memory: 4Gi
          securityContext:
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: config
              mountPath: /etc/buildkit
              readOnly: true
            - name: cache
              mountPath: /home/user/.local/share/buildkit
      volumes:
        - name: config
          configMap:
            name: buildkitd-config
        - name: cache
          persistentVolumeClaim:
            claimName: buildkitd-cache
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: arc-runners
spec:
  selector:
    app: buildkitd
  ports:
    - port: 1234
      targetPort: 1234
      protocol: TCP
---
# The builder speaks plain TCP with no auth, so only pods in arc-runners
# (the runner pools) may reach it. k3s enforces NetworkPolicy itself.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildkitd-ingress
  namespace: arc-runners
spec:
  podSelector:
    matchLabels:
      app: buildkitd
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 1234
          protocol: TCP
