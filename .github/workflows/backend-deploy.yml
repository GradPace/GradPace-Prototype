name: Deploy to Production - Backend

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy, e.g. sha-1234567 (defaults to :latest - there's no commit SHA to derive one from on a manual run)"
        required: false
        type: string
  workflow_run:
    workflows: ["Build and Push Backend to GHCR"]
    types:
      - completed
    branches:
      - main

concurrency:
  # Shared with frontend-deploy.yml - both `make deploy-*` targets act on
  # the same k3s cluster, so serialize rather than race them.
  group: deploy-production
  cancel-in-progress: false

jobs:
  changes:
    # backend-build-and-push.yml now runs (and reports success) on every
    # push touching backend/ OR frontend/, even when its own build-and-push
    # job skipped because backend/ didn't actually change - without this
    # check, a frontend-only change would still trigger a deploy here,
    # rolling out a sha-<...> tag whose image was never actually built or
    # pushed (ImagePullBackOff, same class of bug this tag scheme exists
    # to avoid in the first place).
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
    outputs:
      backend: ${{ steps.filter.outputs.backend || 'true' }}
    steps:
      - name: Check whether an image was actually built and pushed
        # Deploy only if the upstream run's build-and-push job really ran
        # (not skipped) - i.e. sha-<...> for this commit exists in GHCR.
        id: filter
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
            --jq '.jobs[] | select(.name == "build-and-push") | .conclusion')
          echo "build-and-push conclusion: ${conclusion:-<none>}"
          if [ "$conclusion" = "success" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    runs-on: self-hosted
    if: needs.changes.outputs.backend == 'true'
    # Creates a GitHub Deployment for this run - the "GitHub for Jira" app
    # picks these up automatically and shows them on linked issues (e.g.
    # GP-25) under Deployments, so long as the commit/branch/PR references
    # the issue key.
    environment: production
    permissions:
      contents: read

    steps:
      # Image pulls now authenticate via the cluster's own `ghcr-pull`
      # imagePullSecret (see k8s/backend-deployment.yaml) - kubectl itself
      # needs no GHCR credential, so there's no docker login step here.
      - name: Sync deploy scripts with main
        # /srv/prototype is a persistent checkout on this host, not something
        # actions/checkout populates - without this, Makefile/compose changes
        # merged to main never actually reach the host that runs them.
        # Fetches over HTTPS with this run's own short-lived token instead of
        # the origin remote's SSH config, which has no key set up on the host.
        run: |
          cd /srv/prototype
          git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
          git reset --hard FETCH_HEAD

      - name: Deploy to production
        # Pin to the triggering build's own image instead of :latest - a
        # deployment update can no-op if kubectl doesn't see the tag string
        # change, even though the digest behind :latest moved (see
        # Makefile). Only a workflow_run has a head_sha to derive that tag
        # from; a manual workflow_dispatch run has no associated build, so
        # it deploys an explicit `tag` input or falls back to :latest
        # rather than guessing a sha-<...> tag that was never built (the
        # previous `github.sha` fallback here deployed a tag that didn't
        # exist in GHCR and had to be fixed by hand).
        run: |
          cd /srv/prototype
          if [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            TAG="sha-$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)"
          else
            TAG="${{ github.event.inputs.tag }}"
            TAG="${TAG:-latest}"
          fi
          make deploy-backend TAG="$TAG"

      - name: Verify the deployed backend is healthy and serving the new image
        run: |
          sleep 5
          curl -sf -o /dev/null https://gradpace-api.steyaert.xyz/core/healthcheck/ || \
            (echo "::error::https://gradpace-api.steyaert.xyz/core/healthcheck/ did not return 200 after deploy" && exit 1)
