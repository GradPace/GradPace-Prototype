[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "english-words>=2.0.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "python-dotenv>=1.2.3",
]
prod = [
    "gunicorn>=26.2.0",
    "psycopg>=3.3.5",
    "whitenoise>=6.12.0",
]
