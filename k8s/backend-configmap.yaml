# Non-secret env vars for the backend.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: gradpace
data:
  PIPELINE: "production"
  ALLOWED_HOSTS: "gradpace-api.steyaert.xyz"
  CSRF_TRUSTED_ORIGINS: "https://gradpace-api.steyaert.xyz"
  DATABASE_ENGINE: "postgresql"
  DATABASE_NAME: "gradpace_db"
  DATABASE_USERNAME: "gradpace"
  DATABASE_HOST: "db"
  DATABASE_PORT: "5432"
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: "mail"
  EMAIL_PORT: "25"
  # Empty on purpose: no SMTP login. The `mail` Postfix (mail-deployment.yaml)
  # doesn't offer AUTH - it relays for pods on the cluster network
  # (MYNETWORKS in mail-configmap.yaml) - and Django logs in whenever a
  # username AND password are set, so the old value made every send fail with
  # "SMTP AUTH extension not supported by server" (password reset emails
  # included). The email-host-password secret can stay; it is unused without
  # a username.
  EMAIL_HOST_USER: ""
  EMAIL_USE_TLS: "0"
  DEFAULT_FROM_EMAIL: "noreply@gradpace.steyaert.xyz"
  LLAMA_CPP_BASE_URL: "http://llama:8080"
