name: Deploy to Production - Frontend

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Push Frontend to GHCR"]
    types:
      - completed
    branches:
      - main

concurrency:
  # Shared with backend-deploy.yml - both `make deploy-*` targets act on
  # the same k3s cluster, so serialize rather than race them.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # Creates a GitHub Deployment for this run - the "GitHub for Jira" app
    # picks these up automatically and shows them on linked issues (e.g.
    # GP-29) under Deployments, so long as the commit/branch/PR references
    # the issue key.
    environment: production
    permissions:
      contents: read

    steps:
      # Image pulls now authenticate via the cluster's own `ghcr-pull`
      # imagePullSecret (see k8s/frontend-deployment.yaml) - kubectl itself
      # needs no GHCR credential, so there's no docker login step here.
      - name: Sync deploy scripts with main
        # /srv/prototype is a persistent checkout on this host, not something
        # actions/checkout populates - without this, Makefile/compose changes
        # merged to main never actually reach the host that runs them.
        # Fetches over HTTPS with this run's own short-lived token instead of
        # the origin remote's SSH config, which has no key set up on the host.
        run: |
          cd /srv/prototype
          git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
          git reset --hard FETCH_HEAD

      - name: Deploy to production
        # Pin to this commit's own image instead of :latest - a deployment
        # update can no-op if kubectl doesn't see the tag string change,
        # even though the digest behind :latest moved (see Makefile).
        run: |
          cd /srv/prototype
          make deploy-frontend TAG=sha-$(echo "${{ github.event.workflow_run.head_sha || github.sha }}" | cut -c1-7)

      - name: Verify the deployed bundle actually has the API URL baked in
        # Regression guard for GP-57 (VITE_API_URL missing from the built
        # bundle causing every API call to hit /undefined/api/...) - fail
        # loudly here instead of leaving it to be found manually in prod.
        run: |
          sleep 5
          FOUND=0
          for pod in $(kubectl get pods -n gradpace -l app=frontend -o jsonpath='{.items[*].metadata.name}'); do
            if kubectl exec -n gradpace "$pod" -- sh -c "grep -rl 'gradpace-api.steyaert.xyz' /usr/share/nginx/html/assets/*.js" >/dev/null 2>&1; then
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "::error::Deployed frontend bundle does not contain the API URL - VITE_API_URL likely missing at build time."
            exit 1
          fi
          curl -sf -o /dev/null https://gradpace.steyaert.xyz/ || (echo "::error::https://gradpace.steyaert.xyz/ did not return 200 after deploy" && exit 1)
