# Staging host - swap to gradpace-api.steyaert.xyz at cutover (and update
# backend-configmap.yaml's ALLOWED_HOSTS/CSRF_TRUSTED_ORIGINS to match).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: gradpace
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gradpace-api-k3s.steyaert.xyz
      secretName: steyaert-wildcard
  rules:
    - host: gradpace-api-k3s.steyaert.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
