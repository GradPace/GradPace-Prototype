name: gradpace-dev

services:
  # Backend - Django dev server with live reload.
  # Builds from Dockerfile.dev (not backend/Dockerfile, which is the lean prod
  # build with only the `prod` dependency group) - just the same uv image plus
  # graphviz, for `manage.py graph_models` (see the Makefile's schema-diagram
  # target). PIPELINE is unset, so config/settings/__init__.py loads dev.py:
  # sqlite, DEBUG=True, console email.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: >
      sh -c "uv sync &&
             uv run manage.py migrate &&
             uv run manage.py runserver 0.0.0.0:8000"
    environment:
      - UV_PROJECT_ENVIRONMENT=/app/.venv
    volumes:
      - ./backend:/app            # live code - runserver reloads on save
      - backend_venv:/app/.venv   # container's Linux venv, kept off the host
    ports:
      - "8000:8000"
    tty: true

  # Frontend - Vite dev server with HMR.
  # Runs straight from a node image (not frontend/Dockerfile, which is the
  # lean prod build serving a static bundle via nginx).
  frontend:
    image: node:26-alpine
    working_dir: /app
    environment:
      # Without this, corepack's first-run download prompt waits on stdin,
      # which `docker compose up -d` never attaches - it just hangs forever.
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    command: >
      sh -c "corepack enable &&
             pnpm install &&
             pnpm dev --host"
    volumes:
      - ./frontend:/app                           # live code - Vite HMR reloads on save
      - frontend_node_modules:/app/node_modules   # container's Linux modules, kept off the host
    ports:
      - "5173:5173"
    tty: true
    depends_on:
      - backend

volumes:
  backend_venv:
  frontend_node_modules:

# No db / mail services: dev.py uses sqlite and the console email backend.
# To develop against Postgres instead, point dev.py's DATABASES at a `db`
# service here and add one (see docker-compose.prod.yml for the shape).
