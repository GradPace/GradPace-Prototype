name: Build and Push Backend to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      # Docs-only changes (e.g. the schema diagram) shouldn't rebuild/push/
      # redeploy the image - nothing the container runs actually changed.
      - '!backend/docs/**'

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase: GHCR repo refs must be all-lowercase, but this repo's
  # actual name (github.repository) is mixed-case, and must match what
  # docker-compose.prod.yml pulls (ghcr.io/gradpace/gradpace-prototype/backend).
  IMAGE_NAME: gradpace/gradpace-prototype/backend

jobs:
  test:
    # Self-hosted: keeps growing test-suite minutes off the GH Actions quota.
    # Only triggers on push to main right now (see `on:` above), not on PRs -
    # if a pull_request trigger is ever added, self-hosted runners execute
    # whatever the PR's workflow contains, so gate it to trusted authors.
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run checks, lint, and test suite
        run: make test-backend

      - name: Prune uv cache
        # Runs even if tests fail. This is a persistent self-hosted box, so
        # uv's cache accumulates on disk across every run instead of getting
        # thrown away like an ephemeral GH-hosted runner's would.
        if: always()
        working-directory: backend
        run: uv cache prune --ci

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4 

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value={{date 'YYYY-MM-DD-HHmmss' tz='America/New_York'}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64