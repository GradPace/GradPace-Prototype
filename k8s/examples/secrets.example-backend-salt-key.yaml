# Template only - never apply it. It uses the real Secret's name, so applying
# it would overwrite the live secret with this placeholder. That's why it
# lives in k8s/examples/: `kubectl apply -f k8s/` (`make deploy`) doesn't
# descend into subfolders. Real secrets are created out-of-band, never
# committed.
#
# SALT_KEY for the encrypted model fields (backend/accounts/fields.py). Back
# it up outside the cluster along with backend-secret-key - losing either one
# makes every encrypted value unreadable. Comma-separated, newest first, when
# rotating (see backend/README.md).
#
#   kubectl create secret generic backend-salt-key --from-literal=salt-key="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" -n gradpace
apiVersion: v1
kind: Secret
metadata:
  name: backend-salt-key
  namespace: gradpace
type: Opaque
stringData:
  salt-key: "REPLACE_ME"
