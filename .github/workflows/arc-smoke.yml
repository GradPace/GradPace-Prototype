name: ARC Smoke Test

# Health check for the cluster's runner pools - run it from the Actions tab
# after changing anything in infra/arc/ or infra/runner-image/.
on:
  push:
    branches:
      - arc-ci-runners
    paths:
      - '.github/workflows/arc-smoke.yml'
  workflow_dispatch:

jobs:
  light:
    runs-on: gradpace-light
    steps:
      - name: Tools in the runner image
        run: |
          whoami
          make --version | head -1
          kubectl version --client
          gh --version | head -1
          echo "cores: $(nproc)"; free -m | sed -n 2p

      - name: No Kubernetes access from this pool
        # GradPace's pools run with the chart's no-permission service
        # account; only steyaert-projects deploys from a runner pod.
        run: |
          answer=$(kubectl auth can-i get pods -n arc-runners 2>&1 || true)
          echo "can-i get pods: $answer"
          [ "$answer" = "no" ]

  build:
    runs-on: gradpace-build
    steps:
      - name: Use the shared builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.arc-runners:1234

      - name: Build a tiny image through it (not pushed)
        run: |
          printf 'FROM alpine:3.22\nRUN echo "built by $(cat /etc/hostname)" && id\n' \
            | docker buildx build --progress plain --output type=cacheonly -
