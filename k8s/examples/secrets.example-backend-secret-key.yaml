# Template only - never apply it. It uses the real Secret's name, so applying
# it would overwrite the live secret with this placeholder. That's why it
# lives in k8s/examples/: `kubectl apply -f k8s/` (`make deploy`) doesn't
# descend into subfolders. Real secrets are created out-of-band, never
# committed.
#
#   kubectl create secret generic backend-secret-key --from-literal=secret-key='...' -n gradpace
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret-key
  namespace: gradpace
type: Opaque
stringData:
  secret-key: "REPLACE_ME"
