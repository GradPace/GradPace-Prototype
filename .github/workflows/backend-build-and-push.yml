name: Build and Push Backend to GHCR

on:
  workflow_run:
    workflows: ["Test and e2e"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase: GHCR repo refs must be all-lowercase, but this repo's
  # actual name (github.repository) is mixed-case, and must match the image
  # k8s/backend-deployment.yaml pulls (ghcr.io/gradpace/gradpace-prototype/backend).
  IMAGE_NAME: gradpace/gradpace-prototype/backend

jobs:
  changes:
    # Test and e2e runs once for a push touching backend/ and/or frontend/,
    # and its completion triggers this workflow AND
    # frontend-build-and-push.yml both - without this check, a
    # frontend-only change would also rebuild/push/redeploy the backend
    # image for nothing.
    runs-on: gradpace-light
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
    outputs:
      backend: ${{ steps.filter.outputs.backend || 'true' }}
    steps:
      - name: Check whether Test and e2e actually tested backend/
        # test-and-e2e.yml already path-filtered this push - its
        # test-backend job only runs (rather than skips) when backend/
        # changed, so reuse that answer instead of re-diffing here.
        id: filter
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
            --jq '.jobs[] | select(.name == "test-backend") | .conclusion')
          echo "test-backend conclusion: ${conclusion:-<none>}"
          if [ "$conclusion" = "success" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # The runner pod only hands the build to the shared BuildKit builder
    # (infra/arc/buildkit.yaml), which keeps the layer cache.
    runs-on: gradpace-build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the exact commit SHA that triggered this build
        # github.sha in a workflow_run-triggered job is documented as "the
        # most recent commit on the default branch at run time", not
        # necessarily the commit that actually triggered this run - using
        # workflow_run.head_sha (with a github.sha fallback for
        # workflow_dispatch) avoids tagging the wrong commit's image if
        # another push lands in between.
        id: sha
        run: |
          echo "short=$(echo '${{ github.event.workflow_run.head_sha || github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Use the shared builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.arc-runners:1234

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=raw,value={{date 'YYYY-MM-DD-HHmmss' tz='America/New_York'}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
